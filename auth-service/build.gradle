plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.1'
    id 'io.spring.dependency-management' version '1.1.3'

    id "com.diffplug.spotless" version "6.22.0"
}

group = 'com.dentalstack'
version = '0.0.1-SNAPSHOT'

java {
}

ext {
    set('springCloudVersion', "2022.0.0")
}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework:spring-beans'

    implementation 'org.springframework.cloud:spring-cloud-starter-feign:1.4.7.RELEASE'
    implementation 'io.github.openfeign:feign-jackson:12.4'

    // JWT
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'
    implementation 'com.auth0:jwks-rsa:0.22.1'
    implementation 'com.auth0:java-jwt:4.4.0'

    // Google login
    implementation 'com.google.api-client:google-api-client:1.32.1'

    implementation 'com.google.oauth-client:google-oauth-client:1.33.3'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.61'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.springframework:spring-web'

    // Hibernate Validator dependency
    implementation 'org.hibernate.validator:hibernate-validator:8.0.0.Final'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.0'

    //security
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.1.5'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    // Provides jsonb type
    implementation 'io.hypersistence:hypersistence-utils-hibernate-60:3.0.1'

    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    //bucket4j dependency
    implementation 'com.github.vladimir-bukhtoyarov:bucket4j-core:7.6.0'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

spotless {
    java {
        palantirJavaFormat()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
